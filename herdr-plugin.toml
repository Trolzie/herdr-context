id = "trolz.wherewasi"
name = "Where was I"
version = "0.2.0"
min_herdr_version = "0.9.3"
description = "Keeps your plan, progress and what just happened in view beside your agents, so switching context is instant"
platforms = ["linux", "macos"]

[[build]]
command = ["cargo", "build", "--release"]

# Install the agent hooks (Claude Code, Codex, pi) so agents keep the file
# current. `auto_setup = false` in the plugin config turns this off;
# `wherewasi setup --remove` undoes it.
[[build]]
command = ["target/release/wherewasi", "setup", "--quiet"]

# Re-sync on every herdr start, so hook paths stay current after updates.
[[startup]]
command = ["target/release/wherewasi", "setup", "--quiet"]

[[actions]]
id = "toggle"
title = "Toggle where-was-I sidebar"
contexts = ["workspace"]
command = ["target/release/wherewasi", "toggle"]

[[panes]]
id = "sidebar"
title = "where was i"
placement = "split"
command = ["target/release/wherewasi", "view"]

[[panes]]
id = "editor"
title = "edit wherewasi"
placement = "popup"
width = "90%"
height = "90%"
command = ["target/release/wherewasi", "edit"]
