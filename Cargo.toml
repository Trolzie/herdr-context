[package]
name = "herdr-wherewasi"
version = "0.2.0"
edition = "2024"
description = "Where was I? A herdr plugin that keeps your plan and progress in view, so switching context is instant"
license = "MIT"

[[bin]]
name = "wherewasi"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
crossterm = "0.29.0"
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = "0.30.2"
serde = "1.0.229"
serde_json = { version = "1.0.151", features = ["preserve_order"] }
unicode-width = "0.2.2"

[profile.release]
strip = true
