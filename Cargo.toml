[package]
name = "herdr-context"
version = "0.1.0"
edition = "2024"
description = "A herdr plugin that shows a live, rendered Markdown context file beside your agents"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
crossterm = "0.29.0"
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = "0.30.2"
serde_json = "1.0.151"
unicode-width = "0.2.2"

[profile.release]
strip = true
